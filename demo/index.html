<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDK Ads Demo — Pre-Roll Interception</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #09090B;
      color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .demo {
      max-width: 720px;
      width: 100%;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 8px;
      padding: 28px;
    }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    h1 { font-size: 22px; font-weight: 700; color: #FAFAFA; letter-spacing: -0.01em; }
    .chip {
      background: rgba(16, 185, 129, 0.12);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .subtitle { color: #A1A1AA; font-size: 14px; margin-bottom: 22px; }
    .stage {
      position: relative;
      width: 100%;
      height: 320px;
      background: #09090B;
      border: 1px solid #27272A;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    canvas { display: block; }
    .stage-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 16px;
    }
    .stage-overlay.hidden { display: none; }
    .stage-title {
      font-size: 22px;
      font-weight: 700;
      color: #FAFAFA;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 6px;
      padding: 6px 14px;
    }
    .stage-text { font-size: 14px; color: #A1A1AA; max-width: 420px; line-height: 1.5; }
    .score {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #10B981;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 6px;
      padding: 4px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: none;
    }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; }
    button#playBtn {
      flex: 1;
      background: #FAFAFA;
      color: #09090B;
      border: 1px solid #27272A;
      border-radius: 6px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    button#playBtn:hover:not(:disabled) { background: #E4E4E7; }
    button#playBtn:disabled { background: #18181B; color: #52525B; cursor: not-allowed; }
    .log {
      background: #09090B;
      border: 1px solid #27272A;
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #E4E4E7;
      height: 160px;
      overflow-y: auto;
    }
    .log .ok { color: #10B981; }
    .log .warn { color: #FBBF24; }
    .log .info { color: #818CF8; }
    .log .err { color: #F87171; }
  </style>
</head>
<body>
  <div class="demo">
    <div class="head">
      <h1>SDK Ads — Demo Game</h1>
      <span class="chip">PRE-ROLL</span>
    </div>
    <div class="subtitle">Klik "Play Game" untuk menguji intercept iklan Pre-roll (SDK → Backend API)</div>

    <div class="stage">
      <canvas id="gameCanvas" width="672" height="320"></canvas>
      <div class="stage-overlay" id="stageOverlay">
        <div class="stage-title" id="stageTitle">Ready to Play?</div>
        <div class="stage-text" id="stageText">Tekan tombol Play di bawah untuk memuat game. Iklan Pre-roll akan tampil terlebih dahulu sebelum game dimulai.</div>
      </div>
      <div class="score" id="score">Score: 0</div>
    </div>

    <div class="controls">
      <button id="playBtn">Play Game</button>
    </div>

    <div class="log" id="log"></div>
  </div>

  <script src="../packages/sdk/dist/sdk.min.js"></script>
  <script>
    const BACKEND_URL = 'http://localhost:3000';
    const GAME_ID = 'demo-game';
    const DEV_KEY = 'dev-key-demo';

    const playBtn = document.getElementById('playBtn');
    const overlay = document.getElementById('stageOverlay');
    const stageTitle = document.getElementById('stageTitle');
    const stageText = document.getElementById('stageText');
    const scoreEl = document.getElementById('score');
    const logEl = document.getElementById('log');

    function log(message, level) {
      const line = document.createElement('div');
      line.className = level || '';
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Simple bouncing-ball game rendered on canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ball = { x: 336, y: 160, vx: 3, vy: -3, r: 14 };
    let playing = false;
    let score = 0;

    function gameLoop() {
      if (!playing) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#09090B';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.vx *= -1;
      if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) ball.vy *= -1;

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#10B981';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#09090B';
      ctx.stroke();

      score++;
      scoreEl.textContent = 'Score: ' + score;
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      log('Game started! (callback onComplete dipanggil setelah iklan)', 'ok');
      playing = true;
      overlay.classList.add('hidden');
      scoreEl.style.display = 'block';
      score = 0;
      requestAnimationFrame(gameLoop);
    }

    playBtn.addEventListener('click', () => {
      log('Tombol "Play Game" diklik — memicu GendisSDK.showPreRoll()', 'info');
      playBtn.disabled = true;
      window.GendisSDK.showPreRoll(() => {
        playBtn.disabled = false;
        startGame();
      });
    });

    // Initialize SDK on page load
    (async () => {
      log('Memuat SDK (dist/sdk.min.js)...', 'info');
      try {
        await window.GendisSDK.init({
          gameId: GAME_ID,
          developerKey: DEV_KEY,
          apiBaseUrl: BACKEND_URL,
          debug: true,
        });
        log('SDK berhasil diinisialisasi. Config diambil dari ' + BACKEND_URL + '/api/config', 'ok');
      } catch (err) {
        log('Gagal inisialisasi SDK: ' + err.message, 'err');
      }
    })();
  </script>
</body>
</html>
