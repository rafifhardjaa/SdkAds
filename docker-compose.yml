version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdk-ads/backend:latest
    container_name: sdk-ads-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/telemetry.db
    volumes:
      # Persist SQLite data across container restarts
      - sdk-ads-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sdk-ads-data: